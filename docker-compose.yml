service : 
  frontend:
    build: ./frontend
    ports: 
      - "8080:80"
    networks: 
      - frontend_network

  backend:
    build: ./backend 
    depends_on:
      - db 
    environment:
      DB_HOST: db
      WELOVEDEVS_API_KEY: ${WELOVEDEVS_API_KEY}
    networks:
      - frontend_network
      - backend_network

  phpmyadmin: 
    image: phpmyadmin
    restart: always
    depends_on: 
      - db
    ports: 
      - "127.0.0.1:8081:80"
    networks:
      - backend_network

  db:
    image: mysql:8.0
    restart: always
    environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes: 
      - db_data:/var/lib/mysql
    networks: 
      - backend_network

networks:
  frontend_network:
  backend_network: 

volumes:
  db_data: 