services:
  frontend:
    build: ./front-end
    ports:
      - "8080:80"
    networks:
      - frontend_network

  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      WELOVEDEVS_API_KEY: ${WELOVEDEVS_API_KEY:-dummy_key}
    volumes:
      - ./backend/logs:/var/log/jobaggregator
    networks:
      - frontend_network
      - backend_network

  phpmyadmin:
    image: phpmyadmin
    restart: always
    depends_on:
      - db
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - backend_network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-testroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testdb}
      MYSQL_USER: ${MYSQL_USER:-testuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testpassword}
    volumes:
      - db_data:/var/lib/mysql
      - ./data.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend_network

  fail2ban:
    image: crazymax/fail2ban:latest
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./backend/logs:/var/log/jobaggregator
      - ./etc/fail2ban/jail.local:/etc/fail2ban/jail.d/jobaggregator.local:ro
      - ./etc/fail2ban/filter.d/jobaggregator.conf:/etc/fail2ban/filter.d/jobaggregator.conf:ro

networks:
  frontend_network:
  backend_network:

volumes:
  db_data: {}
